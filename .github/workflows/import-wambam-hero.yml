name: Import Wam Bam hero image

on:
  push:
    paths:
      - '.github/workflows/import-wambam-hero.yml'

permissions:
  contents: write

jobs:
  import-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Download new Wam Bam hero artwork
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 \
            'https://5cbe691e-6b92-4fe3-a5b7-0ed017f88529.sandbox.floot.app/_cdn/static/f34a6c63-6b9a-4467-8d0e-9c7a8a21a07b-wambam-hero-temp.webp' \
            --output assets/wambam-hero.webp
          test -s assets/wambam-hero.webp

      - name: Commit hero image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/wambam-hero.webp
          if git diff --cached --quiet; then
            echo 'No image change needed.'
          else
            git commit -m 'Add new Wam Bam hero artwork'
            git push
          fi
